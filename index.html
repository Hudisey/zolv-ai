<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLV.AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: #0d0d0d;
            color: #d1d1d1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Üst Header - Logo Sol Üstte */
        .chat-header {
            background-color: #0d0d0d;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }
        .logo {
            height: 50px; /* Logonun boyutu */
            width: auto;
            object-fit: contain;
        }

        /* Sohbet Alanı */
        .chat-messages {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Kaydırma Çubuğu Minimal */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 10px;
        }

        /* Mesaj Baloncukları */
        .message {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 14px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: #1f1f1f;
            color: #ffffff;
            align-self: flex-end;
            border: 1px solid #2a2a2a;
        }

        .ai-message {
            background-color: transparent;
            color: #b5b5b5;
            align-self: flex-start;
            padding-left: 0; /* Minimal durması için soldan boşluksuz */
        }

        /* Alt Giriş Alanı */
        .chat-input-wrapper {
            padding: 20px 30px;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            border-top: 1px solid #1a1a1a;
        }
        .chat-input-area {
            max-width: 800px;
            width: 100%;
            display: flex;
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .chat-input-area:focus-within {
            border-color: #444;
        }
        .chat-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 18px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background: transparent;
            border: none;
            color: #888;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s;
        }
        .chat-input-area button:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Üst Kısım: Logo Sol Üstte -->
    <div class="chat-header">
        <img src="logo.png" alt="ZOLV.AI Logo" class="logo">
    </div>

    <!-- Sohbet Akışı -->
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">Selam, ne yapmak istiyorsun?</div>
    </div>

    <!-- Giriş Çubuğu -->
    <div class="chat-input-wrapper">
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Bir mesaj yazın..." onkeypress="handleKeyPress(event)">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        async function mesajGonder() {
            const input = document.getElementById('userInput');
            const messagesContainer = document.getElementById('chatMessages');
            const text = input.value.trim();
            
            if (!text) return;

            // Kullanıcı mesajını ekle
            messagesContainer.innerHTML += `<div class="message user-message">${text}</div>`;
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // AI için boş bir mesaj kutusu aç
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai-message';
            messagesContainer.appendChild(aiMessageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch('http://127.0.0.1:8000/yapay-zeka-sor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: text })
                });
                const data = await response.json();
                
                // Mesajın akıcı (smooth / daktilo efektiyle) gelmesi
                typeWriterEffect(aiMessageDiv, data.cevap);

            } catch (error) {
                aiMessageDiv.innerText = 'Bağlantı kurulamadı.';
            }
        }

        // Akıcı daktilo efekti fonksiyonu
        function typeWriterEffect(element, text, i = 0) {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                setTimeout(() => typeWriterEffect(element, text, i + 1), 15); // Harflerin gelme hızı (milisaniye)
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                mesajGonder();
            }
        }
    </script>

</body>
</html>
