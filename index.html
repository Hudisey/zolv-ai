<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolv AI - Gelişmiş Asistan</title>
    <style>
        /* Tam Ekran Koyu Tema */
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* VS Code koyu arka plan rengi */
            color: #d4d4d4; /* VS Code metin rengi */
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Üst Başlık Alanı (Logo ve Başlık) */
        #header {
            background-color: #252526; /* Biraz daha açık koyu */
            border-bottom: 1px solid #333;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center; /* Ortala */
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #header img {
            height: 40px; /* Logoyu küçült */
            margin-right: 15px;
            vertical-align: middle;
        }

        /* Sohbet Penceresi (Ana Ekran) */
        #chat-container {
            flex: 1; /* Kalan tüm boşluğu kapla */
            overflow-y: auto; /* Kaydırılabilir */
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Kod editörü hissi için hafif grileştirilmiş satır numaraları alanı */
            background: linear-gradient(to right, #252526 50px, #1e1e1e 50px);
        }

        /* Mesaj Baloncukları (Kod Tarzı) */
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 6px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            margin-left: 60px; /* Satır numaraları alanından başlat */
        }

        .user-message {
            background-color: #007acc; /* Kullanıcı mesajı (Mavi - VS Code seçim rengi gibi) */
            color: white;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .ai-message {
            background-color: #2d2d2d; /* AI mesajı (Koyu gri) */
            color: #d4d4d4;
            align-self: flex-start;
            border-top-left-radius: 0;
            border: 1px solid #444;
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #858585; /* İsimler için gri ton */
        }

        /* Giriş Alanı (En Alt) */
        #input-area {
            background-color: #252526;
            border-top: 1px solid #333;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background-color: #3c3c3c;
            border: 1px solid #444;
            color: #ffffff;
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        #user-input:focus {
            border-color: #007acc;
        }

        #send-button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        #send-button:hover {
            background-color: #1177bb;
        }

        #send-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Kaydırma çubuğu özelleştirme (Koyu tema için) */
        #chat-container::-webkit-scrollbar {
            width: 10px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 5px;
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body>

    <!-- Header (Logo ve Başlık) -->
    <div id="header">
        <img src="logo.png" alt="Zolv AI Logosu" onerror="this.style.display='none'"> <!-- Hata durumunda logoyu gizle -->
        <span>Zolv AI Assistant v2.0</span>
    </div>

    <!-- Sohbet Geçmişi -->
    <div id="chat-container">
        <!-- Örnek Mesajlar (Silinebilir) -->
        <div class="message ai-message">
            <strong>Zolv AI:</strong>
            Merhaba! Ben Zolv AI, nasıl yardımcı olabilirim? Eski görünümümüzü geri yükledim ve kod editörü temasını uyguladım.
        </div>
    </div>

    <!-- Giriş Alanı -->
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Buraya kod veya metin yazın (örn: 'Python ile bir web sunucusu kur')">
        <button id="send-button" onclick="gonder()">Gönder</button>
    </div>

    <script>
        async function gonder() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const sendButton = document.getElementById('send-button');
            const text = inputField.value.trim();

            if (!text) return;

            // UI'yi güncelle (Yükleniyor durumu)
            inputField.value = '';
            sendButton.disabled = true;
            sendButton.innerText = 'Düşünüyor...';

            // Kullanıcı mesajını ekle
            chatContainer.innerHTML += `
                <div class="message user-message">
                    <strong>Sen:</strong> ${text.replace(/\n/g, '<br>')}
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight; // En alta kaydır

            try {
                // Backend'e istek at (Canlı Render adresine)
                const response = await fetch('/yapay-zeka-sor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ mesaj: text }),
                });

                const data = await response.json();

                // AI cevabını ekle
                chatContainer.innerHTML += `
                    <div class="message ai-message">
                        <strong>Zolv AI:</strong> ${data.cevap.replace(/\n/g, '<br>')}
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight; // En alta kaydır

            } catch (error) {
                // Hata mesajı
                chatContainer.innerHTML += `
                    <div class="message ai-message" style="color: #f44336;">
                        <strong>Hata:</strong> Beklenmedik bir hata oluştu. API anahtarını veya sunucu durumunu kontrol et. (Detay: ${error.message})
                    </div>
                `;
            } finally {
                // UI'yi eski haline getir
                sendButton.disabled = false;
                sendButton.innerText = 'Gönder';
                inputField.focus();
            }
        }

        // Enter tuşuyla gönderme özelliği
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                gonder();
            }
        });
    </script>
</body>
</html>
