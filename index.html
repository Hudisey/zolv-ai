<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOLV.AI</title>
    <!-- FAVICON ÇAĞRISI -->
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e0e0e;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Stilleri */
        header {
            padding: 10px 15px;
            background-color: #161616;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 50px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px;
        }

        .logo-area img {
            height: 100%;
            width: auto;
            object-fit: contain;
            background-color: #222;
            padding: 3px 6px;
            border-radius: 4px;
            display: block;
        }

        h1.site-title {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #fff;
            margin: 0;
        }

        .credits {
            font-size: 0.75rem;
            color: #888;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 0.9rem;
        }

        .ai-message {
            background-color: #1a1a1a;
            color: #e1e1e1;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            border: 1px solid #2a2a2a;
        }

        .ai-message img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        .user-message {
            background-color: #262626;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .user-message img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }

        /* Input Alanı Stilleri */
        .input-container {
            background-color: #161616;
            border-top: 1px solid #222;
            padding: 10px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        #chat-form {
            max-width: 800px;
            width: 100%;
            display: flex;
            align-items: center;
            background-color: #222;
            border-radius: 24px;
            padding: 4px 10px;
            border: 1px solid #333;
            gap: 8px;
        }

        #chat-form:focus-within {
            border-color: #555;
        }

        .upload-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .upload-btn:hover {
            color: #fff;
        }

        #message-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            padding: 6px 0;
        }

        #message-input::placeholder {
            color: #666;
        }

        #send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        #file-preview {
            display: none;
            font-size: 0.7rem;
            color: #4CAF50;
            padding: 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        @media (max-width: 768px) {
            .input-container {
                padding-bottom: env(safe-area-inset-bottom, 15px);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="/static/logo.png" alt="Logo">
            <h1 class="site-title">ZOLV.AI</h1>
        </div>
        <div class="credits">Made by Hudisey</div>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            Selam! Artık sol alttaki "+" butonundan "Görsel ekle" diyerek bana resim gönderebilirsin. Nasıl yardımcı olabilirim?
        </div>
    </div>

    <div class="input-container">
        <form id="chat-form" enctype="multipart/form-data">
            <input type="file" id="image-input" name="file" accept="image/*" style="display: none;">
            <button type="button" class="upload-btn" id="upload-trigger" title="Görsel Ekle">+</button>
            <span id="file-preview"></span>
            <input type="text" id="message-input" name="message" placeholder="Bir şeyler yazın..." autocomplete="off">
            <button type="submit" id="send-btn" title="Gönder">&#10148;</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const filePreview = document.getElementById('file-preview');

        let selectedFile = null;

        uploadTrigger.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                filePreview.textContent = selectedFile.name;
                filePreview.style.display = 'inline';
            } else {
                selectedFile = null;
                filePreview.style.display = 'none';
                filePreview.textContent = '';
            }
        });

        function appendMessage(content, isUser, file = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            if (content) {
                const textP = document.createElement('p');
                textP.textContent = content;
                msgDiv.appendChild(textP);
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = "Yüklenen görsel";
                    msgDiv.appendChild(img);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                };
                reader.readAsDataURL(file);
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];

            if (!text && !file) return;

            appendMessage(text, true, file);

            const formData = new FormData();
            if (text) formData.append('message', text);
            if (file) formData.append('file', file);

            messageInput.value = '';
            imageInput.value = '';
            filePreview.style.display = 'none';
            selectedFile = null;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'Düşünüyor...';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    aiMsgDiv.textContent = data.reply;
                } else {
                    aiMsgDiv.textContent = 'Bir hata oluştu: ' + (data.detail || 'Bilinmeyen hata');
                }
            } catch (err) {
                aiMsgDiv.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
