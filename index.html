<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOLV.AI</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e0e0e;
            color: #f1f1f1;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background-color: #121212;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: -260px;
            height: 100%;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 500;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 10px 16px;
            background-color: #212121;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2a2a2a;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 4px;
        }

        .chat-item:hover {
            background-color: #1a1a1a;
            color: #fff;
        }

        .chat-item .delete-chat {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            display: none;
        }

        .chat-item:hover .delete-chat {
            display: block;
        }

        .chat-item .delete-chat:hover {
            color: #ff4d4d;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #222;
            background-color: #0e0e0e;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-container img {
            height: 28px;
            object-fit: contain;
        }

        .mode-selector {
            display: flex;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 3px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: #333;
            color: #fff;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .message {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 12px;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background-color: #212121;
            color: #fff;
        }

        .message.ai .message-bubble {
            background-color: transparent;
            color: #e0e0e0;
            padding: 0;
        }

        .input-container {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(transparent, #0e0e0e 50%);
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            resize: none;
            max-height: 150px;
            outline: none;
            padding: 6px 0;
        }

        .send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.8;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Sohbetler</h3>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ Yeni Sohbet</button>
        <div class="chat-list" id="chatList">
            <div class="chat-item">
                <span>Sohbet 1</span>
                <button class="delete-chat" onclick="deleteChat(event)">🗑</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="top-bar">
            <div class="top-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo-container">
                    <img src="/logo.png" alt="ZOLV.AI">
                </div>
            </div>
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('text', this)">Text AI</button>
                <button class="mode-btn" onclick="setMode('code', this)">Code AI</button>
                <button class="mode-btn" onclick="setMode('image', this)">Image AI</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-bubble">
                    Selam! Sol alttaki "+" butonundan sohbet açabilir, üst menüden modlar arasında geçiş yapabilirsin. Nasıl yardımcı olabilirim?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Bir şeyler yazın..." onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'text';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function startNewChat() {
            document.getElementById('chatMessages').innerHTML = `
                <div class="message ai">
                    <div class="message-bubble">Yeni sohbet başlatıldı. Nasıl yardımcı olabilirim?</div>
                </div>
            `;
        }

        function deleteChat(event) {
            event.stopPropagation();
            event.target.closest('.chat-item').remove();
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const chatMessages = document.getElementById('chatMessages');

            // Kullanıcı mesajı
            chatMessages.innerHTML += `
                <div class="message user">
                    <div class="message-bubble">${escapeHtml(prompt)}</div>
                </div>
            `;
            input.value = '';

            // 3 noktalı typing baloncuk
            const typingId = 'typing-' + Date.now();
            chatMessages.innerHTML += `
                <div class="message ai" id="${typingId}">
                    <div class="message-bubble">
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, mode: currentMode })
                });

                const data = await response.json();
                document.getElementById(typingId).remove();

                const aiReply = data.response || data.error || "Bir hata oluştu.";
                chatMessages.innerHTML += `
                    <div class="message ai">
                        <div class="message-bubble">${escapeHtml(aiReply)}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(typingId).remove();
                chatMessages.innerHTML += `
                    <div class="message ai">
                        <div class="message-bubble">Bağlantı hatası oluştu.</div>
                    </div>
                `;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
