<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOLV.AI</title>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e0e0e;
            color: #f1f1f1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background-color: #121212;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: -260px;
            height: 100%;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-chat-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            width: calc(100% - 30px);
            margin: 15px 15px 5px 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #1a1a1a;
            border-color: #555;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover {
            background-color: #1a1a1a;
            color: #fff;
        }

        .delete-chat-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            opacity: 0.6;
        }

        .delete-chat-btn:hover {
            background-color: rgba(255, 77, 77, 0.15);
            opacity: 1;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        #overlay.active {
            display: block;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        header {
            padding: 12px 15px;
            background-color: #161616;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 60px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .menu-toggle-btn:hover {
            background-color: #2a2a2a;
            border-color: #555;
        }

        .site-logo {
            height: 56px;
            object-fit: contain;
            user-select: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 90%;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            padding: 0;
            background: none !important;
            border: none !important;
        }

        .ai-message {
            color: #e1e1e1;
            align-self: flex-start;
        }

        .ai-message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        .user-message {
            color: #fff;
            align-self: flex-end;
            text-align: right;
        }

        .user-message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .input-container {
            background-color: #161616;
            border-top: 1px solid #222;
            padding: 12px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        #chat-form {
            max-width: 800px;
            width: 100%;
            display: flex;
            align-items: center;
            background-color: #222;
            border-radius: 24px;
            padding: 6px 12px;
            border: 1px solid #333;
            gap: 10px;
        }

        #chat-form:focus-within {
            border-color: #555;
        }

        .upload-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .upload-btn:hover {
            color: #fff;
        }

        #message-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            padding: 6px 0;
        }

        #message-input::placeholder {
            color: #666;
        }

        #send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        #file-preview {
            display: none;
            font-size: 0.75rem;
            color: #4CAF50;
            padding: 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        @media (max-width: 768px) {
            .input-container {
                padding-bottom: env(safe-area-inset-bottom, 15px);
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2 style="font-size: 1rem; color: #fff;">Sohbetler</h2>
            <button class="menu-toggle-btn" id="sidebar-close" style="font-size: 1rem; width: 30px; height: 30px;">&times;</button>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">
            <span>+</span> Yeni Sohbet
        </button>
        <div class="chat-history-list" id="history-list"></div>
    </div>
    <div id="overlay"></div>

    <div class="main-content">
        <header>
            <div class="header-left">
                <button class="menu-toggle-btn" id="sidebar-toggle" title="Menü">&gt;</button>
                <img src="/static/logo.png" alt="ZOLV.AI" class="site-logo">
            </div>
        </header>

        <div id="chat-container">
            <div class="message ai-message">
                Selam! Sol alttaki "+" butonundan görsel ekleyebilir, menüden yeni sohbet açabilirsin. Nasıl yardımcı olabilirim?
            </div>
        </div>

        <div class="input-container">
            <form id="chat-form" enctype="multipart/form-data">
                <input type="file" id="image-input" name="file" accept="image/*" style="display: none;">
                <button type="button" class="upload-btn" id="upload-trigger" title="Görsel Ekle">+</button>
                <span id="file-preview"></span>
                <input type="text" id="message-input" name="message" placeholder="Bir şeyler yazın..." autocomplete="off">
                <button type="submit" id="send-btn" title="Gönder">&#10148;</button>
            </form>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const filePreview = document.getElementById('file-preview');
        
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarClose = document.getElementById('sidebar-close');
        const overlay = document.getElementById('overlay');
        const newChatBtn = document.getElementById('new-chat-btn');
        const historyList = document.getElementById('history-list');

        let selectedFile = null;
        let chatHistories = JSON.parse(localStorage.getItem('zolv_chats')) || [];

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        });

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        sidebarClose.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        newChatBtn.addEventListener('click', () => {
            const newChatTitle = `Sohbet ${chatHistories.length + 1}`;
            chatHistories.unshift({ title: newChatTitle });
            localStorage.setItem('zolv_chats', JSON.stringify(chatHistories));
            renderHistory();

            chatContainer.innerHTML = `
                <div class="message ai-message">
                    Yeni bir sohbet başlatıldı. Nasıl yardımcı olabilirim?
                </div>
            `;
            closeSidebar();
        });

        function renderHistory() {
            historyList.innerHTML = '';
            if (chatHistories.length === 0) {
                historyList.innerHTML = '<div style="color: #666; font-size: 0.8rem; padding: 10px; text-align: center;">Geçmiş sohbet yok</div>';
                return;
            }
            chatHistories.forEach((chat, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = chat.title;
                titleSpan.style.overflow = 'hidden';
                titleSpan.style.textOverflow = 'ellipsis';
                titleSpan.style.whiteSpace = 'nowrap';
                titleSpan.style.flex = '1';
                
                titleSpan.addEventListener('click', () => {
                    closeSidebar();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-chat-btn';
                deleteBtn.title = 'Sohbeti Sil';
                deleteBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                `;

                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    chatHistories.splice(index, 1);
                    localStorage.setItem('zolv_chats', JSON.stringify(chatHistories));
                    renderHistory();
                });

                item.appendChild(titleSpan);
                item.appendChild(deleteBtn);
                historyList.appendChild(item);
            });
        }
        renderHistory();

        uploadTrigger.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                filePreview.textContent = selectedFile.name;
                filePreview.style.display = 'inline';
            } else {
                selectedFile = null;
                filePreview.style.display = 'none';
                filePreview.textContent = '';
            }
        });

        function appendMessage(content, isUser, file = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            if (content) {
                const textP = document.createElement('p');
                textP.textContent = content;
                msgDiv.appendChild(textP);
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = "Yüklenen görsel";
                    msgDiv.appendChild(img);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                };
                reader.readAsDataURL(file);
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];

            if (!text && !file) return;

            appendMessage(text, true, file);

            const formData = new FormData();
            if (text) formData.append('message', text);
            if (file) formData.append('file', file);

            messageInput.value = '';
            imageInput.value = '';
            filePreview.style.display = 'none';
            selectedFile = null;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            aiMsgDiv.appendChild(typingIndicator);
            
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    aiMsgDiv.textContent = data.reply;
                } else {
                    aiMsgDiv.textContent = 'Bir hata oluştu: ' + (data.detail || 'Bilinmeyen hata');
                }
            } catch (err) {
                aiMsgDiv.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
