<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLV.AI</title>
    <!-- Favicon Ekleme -->
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0e0e0e;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background-color: #161616;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Logo'nun koyu arka planda görünmesi için stil eklemesi */
        .logo-area img {
            height: 32px;
            width: auto;
            object-fit: contain;
            background-color: #222; /* Logonun arkasına hafif bir kontrast kutusu koyar */
            padding: 4px 8px;
            border-radius: 6px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .credits {
            font-size: 0.8rem;
            color: #888;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-message {
            background-color: #262626;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: #1a1a1a;
            color: #e1e1e1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        .ai-message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }

        .input-container {
            background-color: #161616;
            border-top: 1px solid #222;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        #chat-form {
            max-width: 800px;
            width: 100%;
            display: flex;
            align-items: center;
            background-color: #222;
            border-radius: 24px;
            padding: 6px 12px;
            border: 1px solid #333;
            gap: 10px;
        }

        #chat-form:focus-within {
            border-color: #555;
        }

        .upload-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .upload-btn:hover {
            color: #fff;
        }

        #message-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            padding: 8px 0;
        }

        #message-input::placeholder {
            color: #666;
        }

        #send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        #file-preview {
            display: none;
            font-size: 0.8rem;
            color: #4CAF50;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        @media (max-width: 768px) {
            /* Mobilde alt paneli ve giris alanini telefon tuslarinin ustunde kalacak sekilde yukari kaldirir */
            .input-container {
                padding-bottom: env(safe-area-inset-bottom, 25px);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="/logo.png" alt="Logo">
            <h1>ZOLV.AI</h1>
        </div>
        <div class="credits">Made by Hudisey</div>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            Selam! Artık sol alttaki "+" butonundan "Görsel ekle" diyerek bana resim gönderebilirsin. Nasıl yardımcı olabilirim?
        </div>
    </div>

    <div class="input-container">
        <form id="chat-form">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" class="upload-btn" id="upload-trigger" title="Gorsel Ekle">+</button>
            <span id="file-preview"></span>
            <input type="text" id="message-input" placeholder="Bir seyler yazin..." autocomplete="off">
            <button type="submit" id="send-btn">&#10148;</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const filePreview = document.getElementById('file-preview');

        let selectedFile = null;

        uploadTrigger.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                filePreview.textContent = selectedFile.name;
                filePreview.style.display = 'inline';
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text && !selectedFile) return;

            // Kullanici mesaji ekleme
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = text;
            
            if (selectedFile) {
                const imgThumb = document.createElement('img');
                imgThumb.src = URL.createObjectURL(selectedFile);
                userMsgDiv.appendChild(imgThumb);
            }
            
            chatContainer.appendChild(userMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const formData = new FormData();
            formData.append('message', text);
            if (selectedFile) {
                formData.append('file', selectedFile);
            }

            // Inputlari temizle
            messageInput.value = '';
            imageInput.value = '';
            filePreview.style.display = 'none';
            selectedFile = null;

            // Yapay zeka yukleniyor mesaji
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'Dusunuyor...';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    aiMsgDiv.textContent = data.reply;
                } else {
                    aiMsgDiv.textContent = 'Bir hata olustu: ' + (data.detail || 'Bilinmeyen hata');
                }
            } catch (err) {
                aiMsgDiv.textContent = 'Sunucuya baglanirken hata olustu.';
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
