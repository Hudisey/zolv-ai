<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolv AI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Üst Bar (Logo sol, İmza sağ) */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            z-index: 10;
        }

        #logo-container img {
            height: 28px;
            object-fit: contain;
        }

        #signature {
            font-size: 13px;
            color: #666;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Sohbet Alanı */
        #chat-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 80px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            align-self: center;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #262626;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: #171717;
            color: #d1d1d1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #222;
        }

        /* Alt Giriş Alanı */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0d0d0d;
            border-top: 1px solid #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            background-color: #171717;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            padding: 8px 12px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            padding: 6px;
        }

        #send-button {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        #send-button:hover {
            background-color: #444;
        }

        #send-button:disabled {
            background-color: #222;
            color: #555;
            cursor: not-allowed;
        }

        /* Yazıyor... (3 Nokta Animasyonu) */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background-color: #777;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Scrollbar */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <div id="top-bar">
        <div id="logo-container">
            <img src="logo.png" alt="Zolv.ai">
        </div>
        <div id="signature">Made by Hudisey</div>
    </div>

    <!-- Sohbet Akışı -->
    <div id="chat-container">
        <div class="message ai-message">
            Selam! Minimalist ve şık tarzımızla hazırız. Nasıl yardımcı olabilirim?
        </div>
    </div>

    <!-- Girdi Paneli -->
    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Bir şeyler yazın...">
            <button id="send-button" onclick="gonder()">Gönder</button>
        </div>
    </div>

    <script>
        async function gonder() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const sendButton = document.getElementById('send-button');
            const text = inputField.value.trim();

            if (!text) return;

            inputField.value = '';
            sendButton.disabled = true;

            // Kullanıcı mesajı
            chatContainer.innerHTML += `<div class="message user-message">${text}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Düşünüyor animasyonu ekle (3 nokta)
            const typingId = 'typing-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${typingId}" class="message ai-message">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/yapay-zeka-sor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: text }),
                });

                const data = await response.json();

                // Animasyonu kaldır ve gerçek cevabı bas
                document.getElementById(typingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">${data.cevap.replace(/\n/g, '<br>')}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(typingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message" style="color:#ff5555;">Bağlantı hatası oluştu.</div>`;
            } finally {
                sendButton.disabled = false;
                inputField.focus();
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') gonder();
        });
    </script>
</body>
</html>
