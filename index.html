<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolv AI</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-box {
            width: 80%;
            max-width: 600px;
            height: 400px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow-y: auto;
            padding: 15px;
            background-color: #1e1e1e;
            margin-bottom: 10px;
        }
        .input-box {
            display: flex;
            width: 80%;
            max-width: 630px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            margin-left: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h2>Zolv AI Assistant</h2>
    <div id="chat-box"></div>

    <div class="input-box">
        <input type="text" id="user-input" placeholder="Bir şeyler yazın...">
        <button onclick="gonder()">Gönder</button>
    </div>

    <script>
        async function gonder() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();

            if (!text) return;

            // Kullanıcı mesajını ekle
            chatBox.innerHTML += `<p><strong>Sen:</strong> ${text}</p>`;
            inputField.value = '';

            try {
                // Backend'e istek atıyoruz
                const response = await fetch('/yapay-zeka-sor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: text })
                });

                const data = await response.json();
                chatBox.innerHTML += `<p><strong>Zolv AI:</strong> ${data.cevap}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<p style="color:red;"><strong>Hata:</strong> Cevap alınamadı.</p>`;
            }
        }
    </script>
</body>
</html>
