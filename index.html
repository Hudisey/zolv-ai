<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolv AI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Üst Bar ve Logo Ayarları */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            z-index: 10;
        }

        #logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        #logo-container img {
            height: 44px; 
            width: auto;
            object-fit: contain;
            filter: brightness(1.1) drop-shadow(0 0 3px rgba(255, 255, 255, 0.2));
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #new-chat-btn {
            background-color: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        #new-chat-btn:hover {
            background-color: #262626;
            color: #fff;
        }

        #signature {
            font-size: 13px;
            color: #666;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Sohbet Alanı (Baloncuklar kaldırıldı, düz akış) */
        #chat-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 80px;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 800px;
            width: 100%;
            align-self: center;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }

        .user-row {
            align-items: flex-end;
        }

        .ai-row {
            align-items: flex-start;
        }

        .message {
            max-width: 90%;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            color: #e0e0e0;
            background: transparent;
            padding: 0;
            border: none;
        }

        .user-message {
            color: #ffffff;
            font-weight: 500;
        }

        /* Kopyala Butonu Stili */
        .copy-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .copy-btn:hover {
            color: #fff;
            background-color: #1a1a1a;
        }

        /* Kutucuksuz 3 Nokta Animasyonu */
        .typing-container {
            align-self: flex-start;
            padding: 5px 0;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background-color: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Alt Giriş Alanı */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0d0d0d;
            border-top: 1px solid #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            background-color: #171717;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            padding: 8px 12px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            padding: 6px;
        }

        #send-button {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        #send-button:hover {
            background-color: #444;
        }

        #send-button:disabled {
            background-color: #222;
            color: #555;
            cursor: not-allowed;
        }

        /* Scrollbar */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <div id="top-bar">
        <div id="logo-container">
            <img src="/static/logo.png" alt="Zolv.ai">
        </div>
        <div class="top-right">
            <button id="new-chat-btn" onclick="yeniSohbet()">+ Yeni Sohbet</button>
            <div id="signature">Made by Hudisey</div>
        </div>
    </div>

    <!-- Sohbet Akışı -->
    <div id="chat-container">
        <div class="message-row ai-row">
            <div class="message ai-message">Selam! Minimalist tasarıma geçtik. Nasıl yardımcı olabilirim?</div>
        </div>
    </div>

    <!-- Girdi Paneli -->
    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Bir şeyler yazın...">
            <button id="send-button" onclick="gonder()">Gönder</button>
        </div>
    </div>

    <script>
        function yeniSohbet() {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = `
                <div class="message-row ai-row">
                    <div class="message ai-message">Yeni sohbet başlatıldı. Nasıl yardımcı olabilirim?</div>
                </div>
            `;
        }

        function metniKopyala(buttonElement) {
            const messageDiv = buttonElement.parentElement.querySelector('.ai-message');
            const textToCopy = messageDiv.innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                buttonElement.innerText = 'Kopyalandı!';
                setTimeout(() => {
                    buttonElement.innerHTML = `
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Kopyala
                    `;
                }, 2000);
            });
        }

        async function gonder() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const sendButton = document.getElementById('send-button');
            const text = inputField.value.trim();

            if (!text) return;

            inputField.value = '';
            sendButton.disabled = true;

            // Kullanıcı mesajı (Baloncuksuz)
            chatContainer.innerHTML += `
                <div class="message-row user-row">
                    <div class="message user-message">${text}</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Animasyon
            const typingId = 'typing-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${typingId}" class="message-row ai-row typing-container">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/yapay-zeka-sor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: text }),
                });

                const data = await response.json();
                document.getElementById(typingId).remove();

                // AI Mesajı + Kopyala Butonu
                chatContainer.innerHTML += `
                    <div class="message-row ai-row">
                        <div class="message ai-message">${data.cevap.replace(/\n/g, '<br>')}</div>
                        <button class="copy-btn" onclick="metniKopyala(this)">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Kopyala
                        </button>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(typingId).remove();
                chatContainer.innerHTML += `
                    <div class="message-row ai-row">
                        <div class="message ai-message" style="color:#ff5555;">Bağlantı hatası oluştu.</div>
                    </div>
                `;
            } finally {
                sendButton.disabled = false;
                inputField.focus();
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') gonder();
        });
    </script>
</body>
</html>
